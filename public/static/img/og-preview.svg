<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="ogMarkNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#081628"/>
    </linearGradient>
    <linearGradient id="ogMarkChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe4ec"/>
      <stop offset="0.75" stop-color="#9aa4b4"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="ogMarkChromeFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cad6"/>
    </linearGradient>
    <linearGradient id="ogMarkChromeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c1ce"/>
      <stop offset="1" stop-color="#7d8798"/>
    </linearGradient>
    <linearGradient id="ogMarkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset="0.5" stop-color="#d9a62e"/>
      <stop offset="1" stop-color="#a8761a"/>
    </linearGradient>
    <filter id="ogDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />

  <!-- Geometric Grid Accent Lines -->
  <g stroke="rgba(245, 158, 11, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Subtle Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 80 120 L 80 80 L 120 80" />
    <path d="M 1080 80 L 1120 80 L 1120 120" />
    <path d="M 80 510 L 80 550 L 120 550" />
    <path d="M 1080 550 L 1120 550 L 1120 510" />
  </g>

  <!-- Central Card & Emblem -->
  <g filter="url(#ogDrop)">
    <!-- Brand mark: the chrome-and-gold cart on its navy app tile -->
    <g transform="translate(525, 120)">
      <rect width="150" height="150" rx="36" fill="url(#ogMarkNavy)" stroke="url(#ogMarkGold)" stroke-width="2.5" />
      <g transform="translate(75 77) scale(2.05) translate(-32 -32)">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M25 18L29 37M29 37L56 37" stroke="url(#ogMarkChromeBack)" stroke-width="1.1"/>
          <circle cx="54" cy="45" r="2.6" fill="#15171c" stroke="url(#ogMarkChromeBack)"/>
          <path d="M19 44L20 49M46 44L45 49M56 37L55 42M20 49L45 49M45 49L55 42" stroke="url(#ogMarkChrome)" stroke-width="2"/>
          <g stroke="url(#ogMarkChrome)">
            <path d="M20.3 25L23.5 44M25.7 25L28 44M31 25L32.5 44M36.3 25L37 44M41.7 25L41.5 44M52 21.5L51 40.5M17.6 37.2L46.4 37.2L56.4 30.2M16.3 31.1L46.7 31.1L56.7 24.1" stroke-width="1.1"/>
            <path d="M15 25 19 44 46 44 56 37 57 18M46 44L47 25" stroke-width="2"/>
            <path d="M15 25L8 18M25 18L18 11" stroke-width="2.5"/>
            <path d="M15 25 47 25 57 18 25 18Z" stroke-width="3"/>
          </g>
          <path d="M8 18L18 11" stroke="url(#ogMarkGold)" stroke-width="5"/>
          <path d="M8 18L18 11" stroke="#fff6d6" stroke-width="1" stroke-opacity="0.7" transform="translate(0 -1.2)"/>
        </g>
        <rect x="25" y="31" width="16" height="6" rx="1.5" fill="url(#ogMarkGold)"/>
        <circle cx="21" cy="52" r="4" fill="#15171c" stroke="url(#ogMarkChrome)" stroke-width="1.6"/>
        <circle cx="21" cy="52" r="1.3" fill="url(#ogMarkChrome)"/>
        <circle cx="44" cy="52" r="4" fill="#15171c" stroke="url(#ogMarkChrome)" stroke-width="1.6"/>
        <circle cx="44" cy="52" r="1.3" fill="url(#ogMarkChrome)"/>
      </g>
    </g>

    <!-- Main Title -->
    <text
      x="600"
      y="335"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="0.16em"
    >
      CART COMMERCE
    </text>

    <!-- Subtitle / Tagline -->
    <text
      x="600"
      y="382"
      text-anchor="middle"
      fill="#fbbf24"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="0.25em"
    >
      CURATED COMMERCE &#8226; CUSTOM CREATION STUDIOS
    </text>

    <text
      x="600"
      y="430"
      text-anchor="middle"
      fill="rgba(255, 255, 255, 0.7)"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="18"
      font-weight="400"
      letter-spacing="0.04em"
    >
      Personalized Storybooks, Fine Wall Art, Custom Apparel &amp; Social Studio
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(600, 485)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">W2P STUDIOS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">STORYBOOKS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">POSTERS &amp; KICKS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">SOCIAL STUDIO</text>
    </g>
  </g>
</svg>
