<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="ogDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />

  <!-- Geometric Grid Accent Lines -->
  <g stroke="rgba(245, 158, 11, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Subtle Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 80 120 L 80 80 L 120 80" />
    <path d="M 1080 80 L 1120 80 L 1120 120" />
    <path d="M 80 510 L 80 550 L 120 550" />
    <path d="M 1080 550 L 1120 550 L 1120 510" />
  </g>

  <!-- Central Card & Emblem -->
  <g filter="url(#ogDrop)">
    <!-- Cart Icon Emblem (Geometric Monogram) -->
    <g transform="translate(525, 120)">
      <rect width="150" height="150" rx="36" fill="rgba(255, 255, 255, 0.05)" stroke="url(#ogGold)" stroke-width="2.5" />
      <!-- Cart Path -->
      <path
        d="M28 42 H45 L60 90 A6 6 0 0 0 65.8 94 H106 A6 6 0 0 0 111.8 89.2 L120 52 H49"
        fill="none"
        stroke="url(#ogGold)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Starlight Jewel -->
      <g transform="translate(85, 64)">
        <polygon points="0,-18 4.5,-5 18,0 4.5,5 0,18 -4.5,5 -18,0 -4.5,-5" fill="#ffffff" />
        <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#fde047" />
      </g>
      <!-- Wheels -->
      <circle cx="66" cy="112" r="8" fill="url(#ogGold)" />
      <circle cx="66" cy="112" r="3" fill="#0f172a" />
      <circle cx="106" cy="112" r="8" fill="url(#ogGold)" />
      <circle cx="106" cy="112" r="3" fill="#0f172a" />
    </g>

    <!-- Main Title -->
    <text
      x="600"
      y="335"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="0.16em"
    >
      CART COMMERCE
    </text>

    <!-- Subtitle / Tagline -->
    <text
      x="600"
      y="382"
      text-anchor="middle"
      fill="#fbbf24"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="0.25em"
    >
      CURATED COMMERCE &bull; CUSTOM CREATION STUDIOS
    </text>

    <text
      x="600"
      y="430"
      text-anchor="middle"
      fill="rgba(255, 255, 255, 0.7)"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="18"
      font-weight="400"
      letter-spacing="0.04em"
    >
      Personalized Storybooks, Fine Wall Art, Custom Apparel &amp; Social Studio
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(600, 485)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">W2P STUDIOS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">STORYBOOKS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">POSTERS &amp; KICKS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">SOCIAL STUDIO</text>
    </g>
  </g>
</svg>
