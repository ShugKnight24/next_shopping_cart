<svg viewBox="0 0 340 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cart Commerce Logo">
  <title>Cart Commerce Logo</title>
  <defs>
    <linearGradient id="geoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="geoJewelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="geoNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="geoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Visual Mark (Geometric Monogram) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="rgba(15, 23, 42, 0.03)" stroke="rgba(217, 119, 6, 0.25)" stroke-width="1.2" />
    <g filter="url(#geoGlow)">
      <!-- Top Rail & Cart Handle -->
      <path d="M12 18 H20 L27 38 A3 3 0 0 0 29.8 40 H47.5 A3 3 0 0 0 50.4 37.8 L54 23 H23" fill="none" stroke="url(#geoGoldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Faceted Monogram C -->
      <path d="M44 26 C41 23.5 36.5 22.5 32 24 C27 25.7 24 30.5 25 35.5 C26 40.5 31 44 36.5 43 C41 42.2 44.5 39.5 46 37" fill="none" stroke="url(#geoNavyGrad)" stroke-width="2.8" stroke-linecap="round" />
      <!-- Radiant Jewel Gem -->
      <path d="M36 21 L37.5 26 L42.5 27.5 L37.5 29 L36 34 L34.5 29 L29.5 27.5 L34.5 26 Z" fill="url(#geoJewelGrad)" />
      <!-- Dual Wheels -->
      <circle cx="28" cy="49" r="4.2" fill="url(#geoGoldGrad)" />
      <circle cx="28" cy="49" r="1.6" fill="#ffffff" />
      <circle cx="47" cy="49" r="4.2" fill="url(#geoGoldGrad)" />
      <circle cx="47" cy="49" r="1.6" fill="#ffffff" />
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(82, 0)">
    <text x="0" y="37" fill="#0f172a" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="0.14em">CART COMMERCE</text>
    <text x="1" y="54" fill="#d97706" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.28em">SHOPPING MADE SIMPLE</text>
  </g>
</svg>