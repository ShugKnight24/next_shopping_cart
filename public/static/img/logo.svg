<svg viewBox="0 0 340 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cart Commerce Logo">
  <title>Cart Commerce Logo</title>
  <defs>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Favicon Badge Emblem -->
  <g transform="translate(6, 6)">
    <!-- Squircle Badge -->
    <rect width="64" height="64" rx="16" fill="url(#favNavy)" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#favGold)" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- High-Precision Cart Emblem with Starlight Jewel -->
    <g filter="url(#favGlow)">
      <!-- Cart Basket & Handle -->
      <path
        d="M14 19 H21 L26.5 38 A2.5 2.5 0 0 0 28.9 40 H44.5 A2.5 2.5 0 0 0 46.9 38.1 L50 24 H23"
        fill="none"
        stroke="url(#favGold)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Radiant Starlight Jewel -->
      <polygon
        points="36,22 37.5,25.5 41,27 37.5,28.5 36,32 34.5,28.5 31,27 34.5,25.5"
        fill="#ffffff"
      />
      <polygon
        points="36,24 37,26 39,27 37,28 36,30 35,28 33,27 35,26"
        fill="#fde047"
      />

      <!-- Wheels -->
      <circle cx="28.5" cy="48" r="3.5" fill="url(#favGold)" />
      <circle cx="28.5" cy="48" r="1.2" fill="#0f172a" />
      <circle cx="44.5" cy="48" r="3.5" fill="url(#favGold)" />
      <circle cx="44.5" cy="48" r="1.2" fill="#0f172a" />
    </g>
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(84, 0)">
    <text
      x="0"
      y="37"
      fill="#0f172a"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="22"
      font-weight="800"
      letter-spacing="0.14em"
    >
      CART COMMERCE
    </text>
    <text
      x="1"
      y="54"
      fill="#d97706"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.24em"
    >
      SHOPPING MADE SIMPLE
    </text>
  </g>
</svg>