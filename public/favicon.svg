<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cart Commerce favicon: the micro glyph, snapped so strokes land on whole pixels at 16/32px. -->
  <defs>
    <linearGradient id="favNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#081628"/>
    </linearGradient>
    <linearGradient id="favChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe4ec"/>
      <stop offset="0.75" stop-color="#9aa4b4"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="favChromeFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cad6"/>
    </linearGradient>
    <linearGradient id="favChromeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c1ce"/>
      <stop offset="1" stop-color="#7d8798"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset="0.5" stop-color="#d9a62e"/>
      <stop offset="1" stop-color="#a8761a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#favNavy)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="url(#favGold)" stroke-opacity="0.7"/>
  <g>
    <path d="M45 26 56 18 55 34 44 42Z" fill="url(#favChromeBack)"/>
    <g fill="none" stroke="url(#favChromeFlat)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 26L9 18" stroke-width="3"/>
      <path d="M17 26 45 26 56 18 28 18Z" stroke-width="4"/>
      <path d="M28 18 17 26 21 42 44 42 45 26" stroke-width="4"/>
    </g>
    <path d="M9 18L20 10" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round"/>
    <rect x="24" y="32" width="16" height="4" rx="0.5" fill="url(#favGold)"/>
    <circle cx="24" cy="52" r="4" fill="#dfe4ec"/>
    <circle cx="40" cy="52" r="4" fill="#dfe4ec"/>
  </g>
</svg>
